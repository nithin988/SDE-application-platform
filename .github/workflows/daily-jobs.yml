name: Daily job scan

on:
  schedule:
    # 04:00 UTC = 09:30 IST, every day
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch jobs
        run: python scripts/fetch_jobs.py

      - name: Commit updated data
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json docs/data/jobs.json
          git diff --cached --quiet || git commit -m "Daily job data update"
          git push
