<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDE Job Radar</title>
<style>
  :root{
    --bg:#0b0f14; --card:#131a22; --border:#223041; --text:#e6edf3;
    --muted:#8b98a5; --accent:#3fb950; --accent2:#58a6ff; --new:#f0883e;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fa; --card:#ffffff; --border:#d0d7de; --text:#1f2328;
           --muted:#57606a; --accent:#1a7f37; --accent2:#0969da; --new:#bc4c00; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .layout{max-width:1440px;margin:0 auto;padding:0 20px;display:grid;
    grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
  @media (max-width:960px){
    .layout{grid-template-columns:1fr;max-width:720px}
    .sidebar{order:2;position:static;max-height:none;overflow-y:visible}
    .content{order:1}
  }
  header{padding:24px 0 12px}
  h1{margin:0 0 4px;font-size:22px}
  .sub{color:var(--muted);font-size:13px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
  input,select{background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:14px}
  input{flex:1;min-width:180px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0;font-size:13px;color:var(--muted)}
  .stats b{color:var(--text)}
  main{margin:16px 0 60px}
  .sidebar{position:sticky;top:20px;padding:24px 0;width:100%;max-height:calc(100vh - 40px);
    overflow-y:auto}
  .side-card{background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;min-height:0}
  .side-card h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:0 0 12px;flex-shrink:0}
  .side-card ul{list-style:none;margin:0;padding:0 6px 0 0;overflow-y:auto;max-height:320px;
    scrollbar-width:thin}
  .side-card li{font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--border)}
  .side-card li:last-child{border-bottom:none}
  .side-card li a{color:var(--text);text-decoration:none;display:block}
  .side-card li a:hover{color:var(--accent2);text-decoration:underline}
  .side-card .hint{font-size:12px;color:var(--muted);margin-top:10px;flex-shrink:0}
  .job{background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .job-main{min-width:0}
  .job-title{font-weight:600;font-size:15px;margin:0 0 4px;overflow-wrap:break-word}
  .job-meta{font-size:13px;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;
    margin-left:8px;vertical-align:middle}
  .badge-new{background:var(--new);color:#111}
  .apply{flex-shrink:0;background:var(--accent2);color:#fff;text-decoration:none;
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:6px;white-space:nowrap}
  .apply:hover{opacity:.85}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .section{margin-bottom:22px}
  .section-heading{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:0 0 8px 2px}
  footer{max-width:960px;margin:0 auto 30px;padding:0 20px;color:var(--muted);font-size:12px}
  a{color:var(--accent2)}
  .tabs{display:flex;gap:8px;max-width:960px;margin:16px auto 0;padding:0 20px}
  .tab{background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:9px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
  .tab.active{color:var(--text);border-color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2)}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="side-card">
      <h2 id="trackedHeading">Auto-tracked companies</h2>
      <ul id="trackedList"><li>Loading…</li></ul>
    </div>
    <div class="side-card">
      <h2>Check manually</h2>
      <ul id="manualList"><li>Loading…</li></ul>
      <div class="hint">No public API found (or it broke) — apply directly on their careers page.</div>
    </div>
  </aside>

  <div class="content">
    <header>
      <h1>SDE Job Radar</h1>
      <div class="sub">SDE / SWE openings in Hyderabad, Bengaluru &amp; India, pulled daily from company career APIs.</div>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="controls">
      <input id="search" type="text" placeholder="Search title or company...">
      <select id="companyFilter"><option value="">All companies</option></select>
      <select id="newFilter">
        <option value="">All jobs</option>
        <option value="new">New today only</option>
      </select>
    </div>

    <div class="stats" id="stats">Loading...</div>

    <main id="jobs"></main>

    <footer id="footer"></footer>
  </div>
</div>

<script>
const PROFILES = [
  {key: 'nithin', label: 'Nithin — SDE 1'},
  {key: 'jaswanth', label: 'Jaswanth — SDE 2'},
];

function getActiveProfile() {
  try {
    const saved = localStorage.getItem('sde-job-radar-profile');
    if (saved && PROFILES.some(p => p.key === saved)) return saved;
  } catch (e) { /* localStorage unavailable, fall back to default */ }
  return PROFILES[0].key;
}

function setActiveProfile(key) {
  try { localStorage.setItem('sde-job-radar-profile', key); } catch (e) { /* ignore */ }
}

async function loadSidebar() {
  try {
    const res = await fetch('data/companies.json', {cache: 'no-store'});
    const data = await res.json();

    document.getElementById('trackedHeading').textContent =
      `Auto-tracked companies (${data.tracked.length})`;
    document.getElementById('trackedList').innerHTML =
      data.tracked.map(c => c.url
        ? `<li><a href="${c.url}" target="_blank" rel="noopener">${escapeHtml(c.name)}</a></li>`
        : `<li>${escapeHtml(c.name)}</li>`
      ).join('') || '<li>None yet</li>';

    document.getElementById('manualList').innerHTML =
      data.manual.map(c =>
        `<li><a href="${c.url}" target="_blank" rel="noopener">${escapeHtml(c.name)}</a></li>`
      ).join('') || '<li>None</li>';
  } catch (err) {
    document.getElementById('trackedList').innerHTML = '<li>Failed to load</li>';
    document.getElementById('manualList').innerHTML = '<li>Failed to load</li>';
    console.error(err);
  }
}

function renderTabs(activeKey) {
  const container = document.getElementById('tabs');
  container.innerHTML = '';
  for (const p of PROFILES) {
    const btn = document.createElement('button');
    btn.className = 'tab' + (p.key === activeKey ? ' active' : '');
    btn.textContent = p.label;
    btn.addEventListener('click', () => {
      if (p.key !== activeKey) {
        setActiveProfile(p.key);
        loadProfile(p.key);
      }
    });
    container.appendChild(btn);
  }
}

async function loadProfile(key) {
  renderTabs(key);
  document.getElementById('stats').textContent = 'Loading...';
  document.getElementById('jobs').innerHTML = '';
  try {
    const res = await fetch(`data/jobs-${key}.json`, {cache: 'no-store'});
    const data = await res.json();
    window.__data = data;
    renderControls(data);
    render(data);
  } catch (err) {
    document.getElementById('stats').textContent = 'Failed to load job data.';
    console.error(err);
  }
}

function renderControls(data) {
  const companies = [...new Set(data.jobs.map(j => j.company))].sort();
  const sel = document.getElementById('companyFilter');
  sel.innerHTML = '<option value="">All companies</option>';
  companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  document.getElementById('search').value = '';
  document.getElementById('newFilter').value = '';
  document.getElementById('search').oninput = () => render(data);
  document.getElementById('companyFilter').onchange = () => render(data);
  document.getElementById('newFilter').onchange = () => render(data);
}

function render(data) {
  const q = document.getElementById('search').value.toLowerCase();
  const co = document.getElementById('companyFilter').value;
  const newOnly = document.getElementById('newFilter').value === 'new';

  const filtered = data.jobs.filter(j => {
    if (co && j.company !== co) return false;
    if (newOnly && !j.is_new) return false;
    if (q && !(j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('stats').innerHTML =
    `<span>${escapeHtml(data.label || '')}</span>` +
    `<span><b>${data.total}</b> open matches</span>` +
    `<span><b>${data.new_today}</b> new today</span>` +
    `<span>Showing <b>${filtered.length}</b></span>`;

  const container = document.getElementById('jobs');
  container.innerHTML = '';
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">No jobs match your filters.</div>';
  }

  // Amazon alone routinely outnumbers every other company combined, which
  // buries smaller companies' openings - so it gets its own section instead
  // of interleaving with everyone else.
  const amazonJobs = filtered.filter(j => j.company === 'Amazon');
  const otherJobs = filtered.filter(j => j.company !== 'Amazon');

  if (otherJobs.length) {
    container.appendChild(renderSection(`Other companies (${otherJobs.length})`, otherJobs));
  }
  if (amazonJobs.length) {
    container.appendChild(renderSection(`Amazon (${amazonJobs.length})`, amazonJobs));
  }

  const gen = new Date(data.generated_at);
  let footerHtml = `Last updated: ${gen.toLocaleString()} · Updates daily via GitHub Actions.`;
  if (data.errors && data.errors.length) {
    footerHtml += `<br>Fetch warnings: ${data.errors.map(escapeHtml).join('; ')}`;
  }
  document.getElementById('footer').innerHTML = footerHtml;
}

function renderSection(heading, jobs) {
  const section = document.createElement('div');
  section.className = 'section';

  const h = document.createElement('div');
  h.className = 'section-heading';
  h.textContent = heading;
  section.appendChild(h);

  for (const j of jobs) {
    const el = document.createElement('div');
    el.className = 'job';
    el.innerHTML = `
      <div class="job-main">
        <div class="job-title">${escapeHtml(j.title)}${j.is_new ? '<span class="badge badge-new">NEW</span>' : ''}</div>
        <div class="job-meta">${escapeHtml(j.company)} · ${escapeHtml(j.location)} · first seen ${j.first_seen}</div>
      </div>
      <a class="apply" href="${j.url}" target="_blank" rel="noopener">Apply →</a>
    `;
    section.appendChild(el);
  }
  return section;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadProfile(getActiveProfile());
loadSidebar();
</script>
</body>
</html>
